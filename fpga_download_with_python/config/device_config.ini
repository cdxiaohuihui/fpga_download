[hardware]
# FPGA device name.
# You can write the base FPGA model, for example xc7a100t.
# The script will automatically match Vivado hardware names such as xc7a100t_0.
#
# Common Xilinx FPGA base model examples:
#   Artix-7:      xc7a12t, xc7a15t, xc7a25t, xc7a35t, xc7a50t, xc7a75t, xc7a100t, xc7a200t
#   Kintex-7:     xc7k70t, xc7k160t, xc7k325t, xc7k355t, xc7k410t, xc7k420t, xc7k480t
#   Virtex-7:     xc7v585t, xc7v2000t, xc7vx330t, xc7vx415t, xc7vx485t, xc7vx550t, xc7vx690t, xc7vx980t, xc7vx1140t
#   Spartan-7:    xc7s6, xc7s15, xc7s25, xc7s50, xc7s75, xc7s100
#   Zynq-7000:    xc7z007s, xc7z010, xc7z012s, xc7z014s, xc7z015, xc7z020, xc7z030, xc7z035, xc7z045, xc7z100
#   UltraScale:   xcku025, xcku035, xcku040, xcku060, xcku085, xcku095, xcku115, xcku3p, xcku5p, xcku9p, xcku11p, xcku13p, xcku15p
#   Virtex US/+:  xcvu065, xcvu080, xcvu095, xcvu125, xcvu160, xcvu190, xcvu3p, xcvu5p, xcvu7p, xcvu9p, xcvu11p, xcvu13p
#   Zynq US/+:    xczu2cg, xczu2eg, xczu3cg, xczu3eg, xczu4cg, xczu4eg, xczu5cg, xczu5eg, xczu7cg, xczu7eg, xczu9cg, xczu9eg, xczu11eg, xczu15eg, xczu19eg
#   Versal:       xcvc1502, xcvc1702, xcvc1802, xcvc1902, xcvm1102, xcvm1302, xcvm1402, xcvm1502, xcvm1802, xcvm2102, xcvm2202, xcvm2302, xcvm2502, xcve1752, xcve2002, xcve2102, xcve2202, xcve2302, xcve2602, xcve2802
#
# The complete supported list depends on the installed Vivado/Vivado Lab version.
# If the board is connected, the exact runtime name can also be found in Vivado Hardware Manager.
fpga_device = xc7a100t

# Flash cfgmem part name used by Vivado get_cfgmem_parts.
# You can write the base Flash model, for example is25lp128f.
# The script will automatically match Vivado cfgmem names such as is25lp128f-spi-x1_x2_x4.
# If one base model matches multiple Vivado cfgmem parts, the script prefers -spi-x1_x2_x4.
# If it is still ambiguous, the script will ask you to choose by number and write the selected full name here.
#
# Common Flash base model examples:
#   ISSI:       is25lp064a, is25lp128f, is25wp064a, is25wp128f, is25wp256d
#   Micron:     n25q032, n25q064, n25q128, n25q256, mt25ql128, mt25ql256, mt25qu128, mt25qu256
#   Macronix:   mx25l3233f, mx25l6433f, mx25l12833f, mx25l25635f, mx66l51235f
#   Winbond:    w25q32, w25q64, w25q128, w25q256
#   Cypress:    s25fl064l, s25fl128l, s25fl256l, s25fs128s, s25fs256s, s25fs512s
#
# The complete supported list depends on the installed Vivado/Vivado Lab version.
flash_part = is25lp128f
